# pre-commit configuration for PraxisOS
# install with:  pre-commit install
# hooks run: whitespace + JSON/YAML sanity + praxis validate on the demo persona

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
        exclude: '^.pytest_cache/'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: local
    hooks:
      - id: praxis-validate-demo
        name: praxis validate (demo persona)
        entry: praxis validate --root examples/demo-persona
        language: python
        types: [markdown]
        pass_filenames: false