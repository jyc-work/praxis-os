name: validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate demo persona repository
        run: praxis validate --root examples/demo-persona
      - name: Validate fixture repositories (negative control)
        run: |
          set +e
          praxis validate --root tests/fixtures/invalid_repo
          code=$?
          set -e
          if [ "$code" -eq "0" ]; then
            echo "expected invalid_repo to FAIL validation but it passed" >&2
            exit 1
          fi
          echo "invalid_repo correctly failed with exit $code"
      - name: Privacy scan (whole repository, including docs)
        run: python -m praxis.validate_repo_self